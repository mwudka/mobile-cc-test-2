<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Happy Birthday!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ============================================================
// CONSTANTS
// ============================================================
const W = 180, H = 320;
const SURFACE_Y = 235;
const DOME_X = W / 2, DOME_Y = SURFACE_Y;
const DOME_RADIUS = 58;
const DOME_MAX_HP = 12;
const BOMB_INTERVAL = 0.75;
const MISSILE_BASE_INTERVAL = 2.8;
const SAUCER_SMOOTH = 10;
const BOMB_SPEED = 110;
const MISSILE_SPEED = 52;
const MISSILE_TURN_RATE = 2.2;
const MISSILE_LIFETIME = 5;
const SAUCER_MAX_HP = 3;
const FONT = '"Press Start 2P", monospace';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W;
canvas.height = H;

// ============================================================
// AUDIO
// ============================================================
let audioCtx = null;
function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, endFreq, dur, vol, type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function playNoise(dur, vol) {
    if (!audioCtx) return;
    const bufSize = audioCtx.sampleRate * dur;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    const g = audioCtx.createGain();
    src.buffer = buf;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    src.connect(g); g.connect(audioCtx.destination);
    src.start();
}

function sfxBomb() { playTone(300, 80, 0.3, 0.15, 'sine'); }
function sfxExplosion() { playNoise(0.4, 0.25); playTone(120, 40, 0.4, 0.15, 'sawtooth'); }
function sfxMissile() { playTone(180, 600, 0.25, 0.1, 'sawtooth'); }
function sfxHit() { playNoise(0.2, 0.3); playTone(80, 30, 0.3, 0.2, 'square'); }
function sfxDomeHit() { playNoise(0.3, 0.2); playTone(200, 60, 0.3, 0.15, 'square'); }
function sfxVictory() {
    const t = audioCtx.currentTime;
    [523, 659, 784, 1047].forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = f;
        g.gain.setValueAtTime(0, t + i * 0.15);
        g.gain.linearRampToValueAtTime(0.12, t + i * 0.15 + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.4);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(t + i * 0.15);
        osc.stop(t + i * 0.15 + 0.4);
    });
}
function sfxFirework() { playNoise(0.15, 0.08); playTone(800 + Math.random() * 400, 200, 0.3, 0.06, 'sine'); }

// ============================================================
// GAME STATE
// ============================================================
let state = 'title'; // title, playing, gameover, victory
let saucer = { x: W / 2, y: 55, hp: SAUCER_MAX_HP, flash: 0, invuln: 0 };
let dome = { hp: DOME_MAX_HP, flash: 0 };
let bombs = [], missiles = [], particles = [], fireworks = [];
let bombTimer = 0, missileTimer = 1.5;
let victoryTimer = 0;
let bannerY = 0, bannerProgress = 0;
let shake = { x: 0, y: 0, intensity: 0 };
let input = { x: W / 2, y: 55, active: false };
let stars = [], terrain = [], craters = [];
let lastTime = 0;
let titleBlink = 0;

// ============================================================
// INITIALIZATION
// ============================================================
function initWorld() {
    stars = [];
    for (let i = 0; i < 60; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * (SURFACE_Y - 20),
            size: Math.random() < 0.3 ? 2 : 1,
            twinkle: Math.random() * Math.PI * 2,
            speed: 0.5 + Math.random() * 2
        });
    }
    terrain = [];
    for (let x = 0; x <= W; x++) {
        terrain[x] = SURFACE_Y + Math.sin(x * 0.08) * 3 + Math.sin(x * 0.21 + 1) * 2 + Math.sin(x * 0.45 + 2) * 1;
    }
    craters = [
        { x: 20, y: SURFACE_Y + 18, r: 9 },
        { x: 55, y: SURFACE_Y + 25, r: 6 },
        { x: 130, y: SURFACE_Y + 15, r: 8 },
        { x: 160, y: SURFACE_Y + 22, r: 7 },
        { x: 90, y: SURFACE_Y + 35, r: 10 },
    ];
}

function resetGame() {
    saucer = { x: W / 2, y: 55, hp: SAUCER_MAX_HP, flash: 0, invuln: 0 };
    dome = { hp: DOME_MAX_HP, flash: 0 };
    bombs = []; missiles = []; particles = [];
    fireworks = [];
    bombTimer = 0; missileTimer = 1.5;
    victoryTimer = 0; bannerY = 0; bannerProgress = 0;
    shake = { x: 0, y: 0, intensity: 0 };
    input = { x: W / 2, y: 55, active: false };
}

// ============================================================
// SCALING & INPUT
// ============================================================
function resize() {
    const sx = window.innerWidth / W;
    const sy = window.innerHeight / H;
    const s = Math.min(sx, sy);
    canvas.style.width = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
}

function screenToGame(sx, sy) {
    const r = canvas.getBoundingClientRect();
    return { x: (sx - r.left) / r.width * W, y: (sy - r.top) / r.height * H };
}

function handleTap() {
    ensureAudio();
    if (state === 'title') { state = 'playing'; resetGame(); }
    else if (state === 'gameover') { state = 'title'; }
}

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    const p = screenToGame(t.clientX, t.clientY);
    input.x = p.x; input.y = p.y; input.active = true;
    handleTap();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    const p = screenToGame(t.clientX, t.clientY);
    input.x = p.x; input.y = p.y;
}, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); input.active = false; }, { passive: false });

canvas.addEventListener('mousemove', e => {
    const p = screenToGame(e.clientX, e.clientY);
    input.x = p.x; input.y = p.y; input.active = true;
});
canvas.addEventListener('click', () => handleTap());
window.addEventListener('resize', resize);

// ============================================================
// HELPERS
// ============================================================
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function addShake(intensity) { shake.intensity = Math.max(shake.intensity, intensity); }

function spawnParticles(x, y, count, speed, life, colors) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = rand(speed * 0.3, speed);
        particles.push({
            x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: rand(life * 0.5, life), maxLife: life,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: rand(1, 2.5), gravity: 40
        });
    }
}

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
    titleBlink += dt;

    // Screen shake decay
    if (shake.intensity > 0) {
        shake.x = (Math.random() - 0.5) * shake.intensity * 2;
        shake.y = (Math.random() - 0.5) * shake.intensity * 2;
        shake.intensity *= Math.pow(0.05, dt);
        if (shake.intensity < 0.3) { shake.intensity = 0; shake.x = 0; shake.y = 0; }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += p.gravity * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    if (state === 'title') return;

    if (state === 'victory') { updateVictory(dt); return; }

    // Saucer movement
    const tx = clamp(input.x, 10, W - 10);
    const ty = clamp(input.y - 30, 20, SURFACE_Y - 60);
    saucer.x += (tx - saucer.x) * SAUCER_SMOOTH * dt;
    saucer.y += (ty - saucer.y) * SAUCER_SMOOTH * dt;
    saucer.flash = Math.max(0, saucer.flash - dt);
    saucer.invuln = Math.max(0, saucer.invuln - dt);
    dome.flash = Math.max(0, dome.flash - dt);

    // Saucer bob
    saucer.y += Math.sin(titleBlink * 3) * 0.3;

    // Drop bombs
    bombTimer -= dt;
    if (bombTimer <= 0 && state === 'playing') {
        bombTimer = BOMB_INTERVAL;
        bombs.push({ x: saucer.x, y: saucer.y + 5, vy: 0 });
        sfxBomb();
    }

    // Update bombs
    for (let i = bombs.length - 1; i >= 0; i--) {
        const b = bombs[i];
        b.vy += 200 * dt;
        b.y += b.vy * dt;
        // Check dome hit
        if (dome.hp > 0) {
            const d = dist(b.x, b.y, DOME_X, DOME_Y);
            if (b.y <= DOME_Y && d <= DOME_RADIUS + 2) {
                spawnParticles(b.x, b.y, 10, 50, 0.5, ['#ff4400', '#ffaa00', '#ffff00', '#ffffff']);
                addShake(3);
                sfxDomeHit();
                dome.hp--;
                dome.flash = 0.15;
                bombs.splice(i, 1);
                if (dome.hp <= 0) { startVictory(); }
                continue;
            }
        }
        // Hit ground
        if (b.y > SURFACE_Y + 5) {
            spawnParticles(b.x, b.y, 5, 25, 0.3, ['#888', '#aaa', '#666']);
            bombs.splice(i, 1);
        }
    }

    // Launch missiles
    if (dome.hp > 0) {
        const interval = MISSILE_BASE_INTERVAL - (1 - dome.hp / DOME_MAX_HP) * 1.2;
        missileTimer -= dt;
        if (missileTimer <= 0) {
            missileTimer = interval;
            const launchAngle = -Math.PI / 2 + rand(-0.4, 0.4);
            missiles.push({
                x: DOME_X + rand(-20, 20),
                y: DOME_Y - DOME_RADIUS + 5,
                angle: launchAngle,
                life: MISSILE_LIFETIME,
                trail: []
            });
            sfxMissile();
        }
    }

    // Update missiles
    for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        m.life -= dt;
        // Guidance
        const targetAngle = Math.atan2(saucer.y - m.y, saucer.x - m.x);
        let diff = targetAngle - m.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        m.angle += Math.sign(diff) * Math.min(Math.abs(diff), MISSILE_TURN_RATE * dt);
        m.x += Math.cos(m.angle) * MISSILE_SPEED * dt;
        m.y += Math.sin(m.angle) * MISSILE_SPEED * dt;
        // Trail
        m.trail.push({ x: m.x, y: m.y, life: 0.3 });
        if (m.trail.length > 12) m.trail.shift();
        for (const t of m.trail) t.life -= dt;
        m.trail = m.trail.filter(t => t.life > 0);
        // Hit saucer
        if (saucer.invuln <= 0 && dist(m.x, m.y, saucer.x, saucer.y) < 9) {
            saucer.hp--;
            saucer.flash = 0.3;
            saucer.invuln = 1.5;
            addShake(5);
            sfxHit();
            spawnParticles(m.x, m.y, 12, 60, 0.5, ['#ff0000', '#ff4400', '#ffaa00', '#ffffff']);
            missiles.splice(i, 1);
            if (saucer.hp <= 0) { state = 'gameover'; }
            continue;
        }
        // Off screen or expired
        if (m.life <= 0 || m.x < -20 || m.x > W + 20 || m.y < -20 || m.y > H + 20) {
            spawnParticles(m.x, m.y, 6, 30, 0.3, ['#ff4400', '#ff8800']);
            missiles.splice(i, 1);
        }
    }
}

// ============================================================
// VICTORY SEQUENCE
// ============================================================
function startVictory() {
    state = 'victory';
    victoryTimer = 0;
    sfxExplosion();
    addShake(10);
    // Big dome explosion
    for (let i = 0; i < 40; i++) {
        const a = rand(-Math.PI, 0);
        const sp = rand(30, 100);
        particles.push({
            x: DOME_X + Math.cos(a) * rand(0, DOME_RADIUS * 0.8),
            y: DOME_Y + Math.sin(a) * rand(0, DOME_RADIUS * 0.5),
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
            life: rand(0.8, 1.8), maxLife: 1.8,
            color: ['#ff4400', '#ffaa00', '#ffff00', '#ffffff', '#ff00ff'][Math.floor(Math.random() * 5)],
            size: rand(2, 4), gravity: 30
        });
    }
    // Clear missiles
    missiles = [];
    bombs = [];
    sfxVictory();
}

function updateVictory(dt) {
    victoryTimer += dt;

    // Saucer moves to center top
    saucer.x += (W / 2 - saucer.x) * 2 * dt;
    saucer.y += (40 - saucer.y) * 2 * dt;
    saucer.y += Math.sin(titleBlink * 2) * 0.3;

    // Banner unfurls after 2.5s
    if (victoryTimer > 2.5) {
        bannerProgress = Math.min(1, (victoryTimer - 2.5) / 1.5);
    }

    // Launch fireworks after 1.5s
    if (victoryTimer > 1.5 && Math.random() < dt * 3) {
        const fx = rand(15, W - 15);
        const fy = rand(30, SURFACE_Y - 60);
        const col = ['#ff00ff', '#00ffff', '#ffff00', '#ff4444', '#44ff44', '#ff8800'][Math.floor(Math.random() * 6)];
        const count = 18 + Math.floor(Math.random() * 12);
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const s = rand(15, 55);
            fireworks.push({
                x: fx, y: fy, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                life: rand(0.6, 1.3), maxLife: 1.3, color: col, size: rand(1, 2.5), gravity: 25
            });
        }
        sfxFirework();
    }

    // Update fireworks
    for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];
        f.x += f.vx * dt; f.y += f.vy * dt;
        f.vy += f.gravity * dt;
        f.life -= dt;
        if (f.life <= 0) fireworks.splice(i, 1);
    }
}

// ============================================================
// DRAWING
// ============================================================
function drawBackground() {
    ctx.fillStyle = '#080820';
    ctx.fillRect(0, 0, W, H);
    // Stars
    for (const s of stars) {
        const twink = Math.sin(titleBlink * s.speed + s.twinkle);
        const alpha = 0.4 + twink * 0.4;
        ctx.globalAlpha = clamp(alpha, 0.1, 1);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);
    }
    ctx.globalAlpha = 1;
}

function drawMoon() {
    // Surface fill
    ctx.fillStyle = '#5a5a6a';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x++) ctx.lineTo(x, terrain[x]);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    // Lighter top edge
    ctx.strokeStyle = '#7a7a8a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x++) {
        if (x === 0) ctx.moveTo(x, terrain[x]); else ctx.lineTo(x, terrain[x]);
    }
    ctx.stroke();
    // Craters
    for (const c of craters) {
        ctx.fillStyle = '#4a4a58';
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.r, c.r * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#3a3a48';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.r, c.r * 0.5, 0, 0.2, Math.PI - 0.2);
        ctx.stroke();
    }
}

function drawDome() {
    if (dome.hp <= 0 && state !== 'victory') return;
    if (state === 'victory' && victoryTimer > 0.5) return; // dome gone after explosion

    const dmg = 1 - dome.hp / DOME_MAX_HP;
    const flash = dome.flash > 0;

    // Dome body
    ctx.save();
    ctx.beginPath();
    ctx.arc(DOME_X, DOME_Y, DOME_RADIUS, Math.PI, 0);
    ctx.closePath();
    if (flash) {
        ctx.fillStyle = '#ffffff';
    } else {
        const g = ctx.createRadialGradient(DOME_X, DOME_Y - 10, 5, DOME_X, DOME_Y, DOME_RADIUS);
        g.addColorStop(0, `rgba(80,120,160,${0.85 - dmg * 0.2})`);
        g.addColorStop(1, `rgba(30,50,70,${0.9 - dmg * 0.15})`);
        ctx.fillStyle = g;
    }
    ctx.fill();

    // Geodesic lines
    ctx.strokeStyle = flash ? '#ffffff' : `rgba(100,150,190,${0.4 - dmg * 0.15})`;
    ctx.lineWidth = 1;
    // Horizontal arcs
    for (let i = 1; i <= 3; i++) {
        const r = DOME_RADIUS * i / 4;
        const startAngle = Math.acos(Math.min(1, r / DOME_RADIUS));
        ctx.beginPath();
        ctx.ellipse(DOME_X, DOME_Y, DOME_RADIUS, r, 0, Math.PI + 0.1, -0.1);
        ctx.stroke();
    }
    // Radial lines
    for (let a = 0; a < Math.PI; a += Math.PI / 6) {
        ctx.beginPath();
        ctx.moveTo(DOME_X, DOME_Y);
        ctx.lineTo(DOME_X + Math.cos(Math.PI + a) * DOME_RADIUS, DOME_Y + Math.sin(Math.PI + a) * DOME_RADIUS);
        ctx.stroke();
    }

    // Damage cracks
    if (dmg > 0 && !flash) {
        ctx.strokeStyle = '#ff440066';
        ctx.lineWidth = 1;
        const crackCount = Math.floor(dmg * 8);
        for (let i = 0; i < crackCount; i++) {
            const seed = i * 137.5;
            const cx = DOME_X + Math.sin(seed) * DOME_RADIUS * 0.6;
            const cy = DOME_Y - Math.abs(Math.cos(seed * 0.7)) * DOME_RADIUS * 0.7;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.sin(seed * 2) * 8, cy + Math.cos(seed * 3) * 6);
            ctx.lineTo(cx + Math.sin(seed * 3) * 5, cy + Math.cos(seed * 2) * 10);
            ctx.stroke();
        }
    }

    // Dome base glow
    ctx.strokeStyle = flash ? '#ffffff' : '#4488aa88';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(DOME_X - DOME_RADIUS, DOME_Y);
    ctx.lineTo(DOME_X + DOME_RADIUS, DOME_Y);
    ctx.stroke();
    ctx.restore();
}

function drawSaucer(time) {
    const sx = Math.floor(saucer.x);
    const sy = Math.floor(saucer.y);
    const flash = saucer.flash > 0 && Math.floor(saucer.flash * 20) % 2 === 0;
    const invFlash = saucer.invuln > 0 && Math.floor(saucer.invuln * 8) % 2 === 0;

    if (state === 'gameover') return; // don't draw destroyed saucer

    ctx.globalAlpha = invFlash ? 0.4 : 1;

    // Body (ellipse)
    ctx.fillStyle = flash ? '#ffffff' : '#a0a0b8';
    ctx.beginPath();
    ctx.ellipse(sx, sy, 10, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    // Cockpit dome
    ctx.fillStyle = flash ? '#ffffff' : '#40e0d0';
    ctx.beginPath();
    ctx.ellipse(sx, sy - 3, 5, 4, 0, Math.PI, 0);
    ctx.fill();
    // Lights
    if (!flash) {
        const lightColors = ['#ff00ff', '#00ffff', '#ffff00', '#ff4444'];
        for (let i = 0; i < 4; i++) {
            const a = time * 3 + i * Math.PI / 2;
            const lx = sx + Math.cos(a) * 8;
            const ly = sy + Math.sin(a) * 2.5;
            ctx.fillStyle = lightColors[i];
            ctx.fillRect(Math.floor(lx), Math.floor(ly), 2, 2);
        }
    }
    // Underside glow
    ctx.fillStyle = 'rgba(64, 224, 208, 0.3)';
    ctx.fillRect(sx - 3, sy + 3, 6, 2);
    ctx.globalAlpha = 1;
}

function drawBombs() {
    for (const b of bombs) {
        // Trail
        ctx.fillStyle = '#39ff1444';
        ctx.fillRect(Math.floor(b.x) - 1, Math.floor(b.y) - 4, 2, 4);
        // Bomb
        ctx.fillStyle = '#39ff14';
        ctx.fillRect(Math.floor(b.x) - 1, Math.floor(b.y) - 1, 3, 3);
    }
}

function drawMissiles() {
    for (const m of missiles) {
        // Trail
        for (const t of m.trail) {
            const alpha = t.life / 0.3;
            ctx.fillStyle = `rgba(255,80,0,${alpha * 0.4})`;
            ctx.fillRect(Math.floor(t.x), Math.floor(t.y), 1, 1);
        }
        // Missile body
        ctx.save();
        ctx.translate(Math.floor(m.x), Math.floor(m.y));
        ctx.rotate(m.angle);
        ctx.fillStyle = '#ff3333';
        ctx.fillRect(-3, -1, 6, 2);
        // Nose
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(3, -1, 1, 2);
        // Flame
        ctx.fillStyle = '#ff8800';
        ctx.fillRect(-5, -1, 2, 2);
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(-4, 0, 1, 1);
        ctx.restore();
    }
}

function drawParticles(list) {
    for (const p of list) {
        const alpha = clamp(p.life / p.maxLife, 0, 1);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        const s = Math.ceil(p.size * alpha);
        ctx.fillRect(Math.floor(p.x), Math.floor(p.y), s, s);
    }
    ctx.globalAlpha = 1;
}

function drawCake() {
    if (state !== 'victory' || victoryTimer < 1.0) return;
    const fadeIn = clamp((victoryTimer - 1.0) / 0.5, 0, 1);
    ctx.globalAlpha = fadeIn;

    const cx = DOME_X, cy = DOME_Y;
    // Bottom tier
    ctx.fillStyle = '#ff69b4';
    ctx.fillRect(cx - 20, cy - 18, 40, 18);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 20, cy - 18, 40, 3);
    // Icing drips bottom tier
    for (let i = 0; i < 8; i++) {
        const dx = cx - 18 + i * 5;
        ctx.fillRect(dx, cy - 15, 2, 2 + (i % 3));
    }
    // Middle tier
    ctx.fillStyle = '#ff85c0';
    ctx.fillRect(cx - 14, cy - 30, 28, 12);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 14, cy - 30, 28, 2);
    for (let i = 0; i < 5; i++) {
        const dx = cx - 12 + i * 6;
        ctx.fillRect(dx, cy - 28, 2, 2 + (i % 2));
    }
    // Top tier
    ctx.fillStyle = '#ffaad4';
    ctx.fillRect(cx - 9, cy - 40, 18, 10);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - 9, cy - 40, 18, 2);
    // Candles
    const candlePositions = [-6, -2, 2, 6];
    for (const cp of candlePositions) {
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(cx + cp, cy - 46, 2, 6);
        // Flame
        const flicker = Math.sin(titleBlink * 10 + cp) * 0.5;
        ctx.fillStyle = '#ff4400';
        ctx.fillRect(cx + cp - 1 + Math.floor(flicker), cy - 49, 3, 3);
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(cx + cp + Math.floor(flicker), cy - 48, 1, 1);
    }
    // Cherry on top
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(cx, cy - 43, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff6666';
    ctx.fillRect(cx - 1, cy - 45, 1, 1);

    ctx.globalAlpha = 1;
}

function drawBanner() {
    if (bannerProgress <= 0) return;
    const bw = 120, bh = 28 * bannerProgress;
    const bx = W / 2 - bw / 2;
    const by = saucer.y + 10;

    // Banner background
    ctx.fillStyle = '#1a0033';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#ff00ff';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);
    // Inner border
    if (bh > 6) {
        ctx.strokeStyle = '#00ffff';
        ctx.strokeRect(bx + 2, by + 2, bw - 4, bh - 4);
    }

    // Text (only when mostly unfurled)
    if (bannerProgress > 0.7) {
        const textAlpha = (bannerProgress - 0.7) / 0.3;
        ctx.globalAlpha = textAlpha;
        ctx.fillStyle = '#ff00ff';
        ctx.font = `7px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('HAPPY', W / 2, by + bh / 2 - 5);
        ctx.fillStyle = '#00ffff';
        ctx.fillText('BIRTHDAY!', W / 2, by + bh / 2 + 5);
        ctx.globalAlpha = 1;
    }
}

function drawHUD() {
    if (state !== 'playing') return;
    // Lives
    for (let i = 0; i < saucer.hp; i++) {
        const hx = 5 + i * 10;
        ctx.fillStyle = '#40e0d0';
        ctx.beginPath();
        ctx.ellipse(hx + 4, 8, 4, 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#a0a0b8';
        ctx.beginPath();
        ctx.ellipse(hx + 4, 9, 5, 2, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    // Dome HP bar
    if (dome.hp > 0) {
        const barW = 50, barH = 4;
        const bx = W / 2 - barW / 2, by = 4;
        ctx.fillStyle = '#222';
        ctx.fillRect(bx, by, barW, barH);
        const frac = dome.hp / DOME_MAX_HP;
        const col = frac > 0.5 ? '#44aaff' : frac > 0.25 ? '#ffaa00' : '#ff4444';
        ctx.fillStyle = col;
        ctx.fillRect(bx, by, barW * frac, barH);
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 1;
        ctx.strokeRect(bx, by, barW, barH);
    }
}

function drawTitleScreen(time) {
    // Darken
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Title
    ctx.font = `10px ${FONT}`;
    ctx.fillStyle = '#ff00ff';
    ctx.fillText('BIRTHDAY', W / 2, H / 2 - 40);
    ctx.fillStyle = '#00ffff';
    ctx.fillText('BLAST', W / 2, H / 2 - 22);

    // Subtitle
    ctx.font = `5px ${FONT}`;
    ctx.fillStyle = '#ffff00';
    ctx.fillText('DESTROY THE DOME', W / 2, H / 2 + 5);
    ctx.fillText('TO REVEAL THE', W / 2, H / 2 + 15);
    ctx.fillText('SURPRISE!', W / 2, H / 2 + 25);

    // Blink
    if (Math.floor(time * 2) % 2 === 0) {
        ctx.font = `6px ${FONT}`;
        ctx.fillStyle = '#ffffff';
        ctx.fillText('TAP TO START', W / 2, H / 2 + 55);
    }

    // Controls hint
    ctx.font = `4px ${FONT}`;
    ctx.fillStyle = '#888888';
    ctx.fillText('DRAG TO MOVE SAUCER', W / 2, H / 2 + 80);
    ctx.fillText('BOMBS DROP AUTOMATICALLY', W / 2, H / 2 + 90);
}

function drawGameOver(time) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `9px ${FONT}`;
    ctx.fillStyle = '#ff4444';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 15);
    if (Math.floor(time * 2) % 2 === 0) {
        ctx.font = `5px ${FONT}`;
        ctx.fillStyle = '#ffffff';
        ctx.fillText('TAP TO RETRY', W / 2, H / 2 + 10);
    }
}

function drawVictoryText() {
    if (victoryTimer < 4) return;
    const pulse = 0.8 + Math.sin(titleBlink * 4) * 0.2;
    ctx.globalAlpha = clamp((victoryTimer - 4) / 1, 0, 1);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `5px ${FONT}`;
    ctx.fillStyle = `hsl(${(titleBlink * 60) % 360}, 100%, 70%)`;
    ctx.save();
    ctx.translate(W / 2, H - 30);
    ctx.scale(pulse, pulse);
    ctx.fillText('YOU DID IT!', 0, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
}

// ============================================================
// MAIN DRAW
// ============================================================
function draw() {
    ctx.save();
    ctx.translate(Math.floor(shake.x), Math.floor(shake.y));

    drawBackground();
    drawMoon();
    if (state === 'victory' && victoryTimer > 1.0) {
        drawCake();
    }
    drawDome();
    drawBombs();
    drawMissiles();
    drawSaucer(titleBlink);
    drawParticles(particles);
    drawParticles(fireworks);
    drawHUD();

    if (state === 'victory') {
        drawBanner();
        drawVictoryText();
    }

    ctx.restore(); // undo shake

    if (state === 'title') drawTitleScreen(titleBlink);
    if (state === 'gameover') drawGameOver(titleBlink);
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(ts) {
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

// ============================================================
// START
// ============================================================
initWorld();
resize();
document.fonts.ready.then(() => {
    requestAnimationFrame(gameLoop);
});
</script>
</body>
